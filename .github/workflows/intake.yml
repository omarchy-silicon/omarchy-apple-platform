name: Q-00 intake dataset

on:
  push:
  pull_request:

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test tools
        run: python -m pip install -e . pytest
      - name: Existing platform regression
        run: python -m pytest -q tests/test_foundation.py tests/test_conformance.py tests/test_release_compliance.py
      - name: Q-00 tests
        run: python -m pytest -q tests/test_intake.py
      - name: Offline validator and drift
        run: |
          python tools/intake/offline_ci.py
          python tools/intake/drift.py
      - name: Deterministic generator check
        run: |
          cp data/intake/manifest.json /tmp/intake-manifest.json
          cp data/intake/manifest.lock.json /tmp/intake-manifest.lock.json
          python tools/intake/generate.py
          cmp /tmp/intake-manifest.json data/intake/manifest.json
          cmp /tmp/intake-manifest.lock.json data/intake/manifest.lock.json
      - name: Installed wheel check
        run: |
          python -m pip wheel --no-deps -w /tmp/omarchy-q00-wheel .
          python -m venv /tmp/omarchy-q00-wheel-venv
          /tmp/omarchy-q00-wheel-venv/bin/python -m pip install jsonschema==4.26.0 rfc8785==0.1.4 /tmp/omarchy-q00-wheel/*.whl
          /tmp/omarchy-q00-wheel-venv/bin/python -m omarchy_intake validate --manifest "$GITHUB_WORKSPACE/data/intake/manifest.json" --root "$GITHUB_WORKSPACE" --offline
      - name: Diff and secret hygiene
        run: |
          git diff --check
          ! rg -n '(^|[[:space:]])(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' --glob '!*.lock' .
