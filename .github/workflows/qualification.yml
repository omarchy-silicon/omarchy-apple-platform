name: qualification

on:
  push:
  pull_request:

jobs:
  q01:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e .
      - run: python tools/qualification/drift.py
      - run: python -m pytest -q tests/test_qualification.py
      - run: python -m omarchy_qualification validate --record fixtures/qualification/j313-unknown.json --inventory data/qualification/inventory.json --intake data/intake/manifest.json
