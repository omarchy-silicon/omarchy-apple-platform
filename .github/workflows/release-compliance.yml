name: F-06 release compliance

on:
  pull_request:
  push:

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test tools
        run: python -m pip install -e . pytest
      - name: Foundation regression first
        run: python -m pytest -q tests/test_foundation.py
      - name: Compliance tests and hostile gates
        run: |
          python -m pytest -q tests/test_release_compliance.py
          PYTHONPATH=src python tools/compliance/drift.py
          PYTHONPATH=src python tools/compliance/generate.py
      - name: Accepted CLI and deterministic attestation
        run: |
          PYTHONPATH=src python -m omarchy_release_compliance validate fixtures/compliance/accepted.json
          PYTHONPATH=src python -m omarchy_release_compliance evaluate fixtures/compliance/accepted.json
          a=$(PYTHONPATH=src python -m omarchy_release_compliance attest fixtures/compliance/accepted.json)
          b=$(PYTHONPATH=src python -m omarchy_release_compliance attest fixtures/compliance/accepted.json)
          test "$a" = "$b"
      - name: Build wheel
        run: python -m pip wheel --no-deps -w /tmp/omarchy-f06-wheel .
      - name: Diff and secret scans
        run: |
          git diff --check
          ! rg -n '(^|[[:space:]])(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' --glob '!*.lock' .
