name: F-05 candidate assembly

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  candidate-assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test tools
        run: python -m pip install -e . pytest
      - name: F-05 focused and full tests
        run: python -m pytest -q tests/test_candidate_assembly.py && python -m pytest -q
      - name: Schema and generated binding drift
        run: PYTHONPATH=src python tools/candidate/drift.py
      - name: Regeneration is clean
        run: |
          cp src/omarchy_candidate/generated.py /tmp/f05-generated.py
          PYTHONPATH=src python tools/candidate/generate.py
          cmp /tmp/f05-generated.py src/omarchy_candidate/generated.py
      - name: Wheel and unrelated cwd CLI
        run: |
          python -m pip wheel --no-deps -w /tmp/omarchy-f05-wheel .
          python -m venv /tmp/omarchy-f05-wheel-venv
          /tmp/omarchy-f05-wheel-venv/bin/python -m pip install --find-links /tmp/omarchy-f05-wheel omarchy-platform-contracts
          cd /tmp
          /tmp/omarchy-f05-wheel-venv/bin/omarchy-candidate assemble --input "$GITHUB_WORKSPACE/fixtures/candidate/accepted-input.json" 2>/tmp/f05-error && exit 1 || test "$(python -c 'import json; print(json.load(open("/tmp/f05-error"))["code"])')" = AUTHORITY_REQUIRED
      - name: Hygiene
        run: |
          git diff --check
          ! rg -n '^(<<<<<<<|=======|>>>>>>>)( |$)' . --glob '!*.lock'
          ! rg -n '(^|[[:space:]])(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' . --glob '!*.lock'
